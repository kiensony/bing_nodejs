services:
    microsoft-rewards-script:
        environment:
            API_MODE: 'true'
            API_HOST: '0.0.0.0'
            API_PORT: '3010'
            API_TOKEN: '${API_TOKEN:?Set API_TOKEN in .env before starting monitoring}'

    prometheus:
        image: prom/prometheus:v3.16.0-busybox
        restart: unless-stopped
        entrypoint: ['/bin/sh', '/etc/prometheus/entrypoint.sh']
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
        environment:
            API_TOKEN: '${API_TOKEN:?Set API_TOKEN in .env before starting monitoring}'
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./monitoring/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
            - prometheus-data:/prometheus
        depends_on:
            microsoft-rewards-script:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true

    grafana:
        image: grafana/grafana:13.2.5-ubuntu
        restart: unless-stopped
        environment:
            GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}'
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/accounts.json
        ports:
            - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
        volumes:
            - grafana-data:/var/lib/grafana
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
        depends_on:
            - prometheus
        security_opt:
            - no-new-privileges:true

volumes:
    prometheus-data:
    grafana-data:
